title = "Herden gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and deterministic test fixtures"
paths = [
  '''^Packages/HerdenSSH/Tests/''',
  '''^Tests/''',
  '''^plugin/test-vectors/''',
  '''^relay/test/''',
  '''^runtime/vendor/''',
]

