name: Herden
options:
  bundleIdPrefix: com.3loc
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

settings:
  base:
    # Swift 6 language mode implies complete strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic

packages:
  # Repository-local package owning the libssh2/OpenSSL implementation and
  # checked-in native artifacts. The one SSH backend (ADR 0011).
  HerdenSSH:
    path: Packages/HerdenSSH
  # Pin the reviewed 1.4.0 source commit because upstream removed its release
  # tag. This keeps the same prebuilt libghostty checksum without taking the
  # much larger, unaudited 1.5.1 source and binary update.
  GhosttyTerminal:
    url: https://github.com/lakr233/libghostty-spm.git
    revision: "356f730bec03281fc7b83666a129b0246137ea26"

targets:
  Herden:
    type: application
    platform: iOS
    sources:
      - path: Sources/Herden
        excludes:
          # Bundled as a folder reference below so notice files stay under
          # Notices/ in the app bundle rather than flattening to the root.
          - Resources/Notices
      # Notification code shared with the service extension: envelope
      # decryption, Notification Key store, alert renderer (ADR 0008).
      - Sources/HerdenNotificationCore
      # Shared notification and activity models remain app-local. Herden does
      # not ship Herden's push service or widget extensions.
      - Sources/HerdenActivityCore
      - Sources/HerdenWidgets/AgentLiveActivityWidget.swift
      - Sources/HerdenWidgets/AgentActivityDecryptor.swift
      # Audited third-party notices + inventory.json (#161). Folder reference
      # preserves the Notices/ subdirectory the catalogue resolves against.
      - path: Sources/Herden/Resources/Notices
        type: folder
        buildPhase: resources
    entitlements:
      path: Sources/Herden/Herden.entitlements
      properties:
        # Shared by the app and Share Extension. Automatic signing provisions
        # this identifier for the selected Apple development team.
        com.apple.security.application-groups:
          - group.ltd.3loc.herden.shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ltd.3loc.herden
        # Optional manual-profile UUID for API-provisioned device installs on
        # build Macs that intentionally have no interactive Apple account.
        PROVISIONING_PROFILE: "$(HERDEN_APP_PROVISIONING_PROFILE_UUID)"
        INFOPLIST_KEY_CFBundleDisplayName: Herden
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "24"
        # Scan to Pair (#62) reads the Pairing Code QR from the computer screen.
        INFOPLIST_KEY_NSCameraUsageDescription: "Herden uses the camera to scan the Pairing Code shown on your computer, so you can add that machine without typing anything."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Herden uses the microphone for on-device terminal dictation."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Herden converts speech to terminal text on this iPhone."
        # Only exempt encryption is used (standard SSH algorithms via the
        # HerdenSSH package's libssh2/OpenSSL, OS-provided CryptoKit);
        # declaring it here keeps every TestFlight upload from stalling on the
        # Missing Compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iPhone only. App Store Connect derives device support from the build.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: HerdenShareExtension
        embed: true
      - package: HerdenSSH
      - package: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyTheme

  HerdenShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/HerdenShareExtension
      - Sources/Herden/Attachments/AttachmentStaging.swift
      - Sources/Herden/Files
      - Sources/Herden/Images/ImagePreparer.swift
      - Sources/Herden/Skills/AgentSkill.swift
      - Sources/Herden/Skills/SkillFrontmatter.swift
      - Sources/Herden/Skills/SkillProbe.swift
      - Sources/Herden/Transport
      - Sources/Herden/Console/ConsoleAgent.swift
      - Sources/Herden/Console/WorktreeRemoval.swift
      - Sources/Herden/Hosts/Host.swift
      - Sources/Herden/Hosts/HostCredentialsProvider.swift
      - Sources/Herden/Hosts/HostStore.swift
      - Sources/Herden/Hosts/TransportConnector.swift
      - Sources/Herden/Notifications/NotificationRegistrationError.swift
      - Sources/Herden/Support/SharedAppStorage.swift
      - Sources/Herden/Support/HerdenBrand.swift
      - Sources/Herden/Resources/Fonts/Inter-Regular.ttf
      - Sources/Herden/Resources/Fonts/InstrumentSerif-Regular.ttf
      - path: Sources/Herden/Sharing
        excludes:
          - SharedTransfersView.swift
      - Sources/HerdenActivityCore/TerminalTitleGlyphs.swift
      - Sources/Herden/Terminal/TerminalTextSafety.swift
    entitlements:
      path: Sources/HerdenShareExtension/HerdenShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ltd.3loc.herden.shared
    settings:
      base:
        INFOPLIST_FILE: Sources/HerdenShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: ltd.3loc.herden.share
        PROVISIONING_PROFILE: "$(HERDEN_SHARE_PROVISIONING_PROFILE_UUID)"
        PRODUCT_NAME: HerdenShareExtension
        MARKETING_VERSION: "0.1.5"
        CURRENT_PROJECT_VERSION: "24"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: HerdenSSH

  HerdenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/HerdenTests
      # Shared Pairing Code vectors (ADR 0007): the same file the Node plugin
      # tests consume, bundled so the Swift tests cannot drift from it.
      - path: plugin/test-vectors/pairing-code-v1.json
      - path: plugin/test-vectors/pairing-code-v2.json
        buildPhase: resources
      # Shared notification envelope vectors (ADR 0008), same arrangement.
      - path: plugin/test-vectors/notification-payload-v1.json
        buildPhase: resources
      # Shared Live Activity details envelope vectors, same arrangement.
      - path: plugin/test-vectors/live-activity-content-v1.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ltd.3loc.herden.tests
    dependencies:
      - target: Herden
      - package: HerdenSSH
      - package: GhosttyTerminal

schemes:
  Herden:
    build:
      targets:
        Herden: all
    test:
      targets:
        - HerdenTests
      # The only variable the app test process needs from the invoking shell.
      # The fixture itself arrives through the Simulator's launchd environment
      # as HERDEN_SSH_E2E_CONFIG / HERDEN_SSH_JUMP_E2E_CONFIG /
      # HERDEN_PAIRING_E2E_CONFIG, which must stay off this list: an entry here
      # is forwarded unconditionally, substituting an empty string when the
      # shell has not exported it, and would shadow the launchd value.
      environmentVariables:
        HERDEN_SSH_E2E_REQUIRED: $(HERDEN_SSH_E2E_REQUIRED)
    run:
      config: Debug
