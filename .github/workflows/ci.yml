# Headless iOS Simulator build and test suite (User Story 12, refs #23).
#
# Runs the full XCTest suite on an iOS simulator. Kept deliberately minimal:
# no signing certificates, no archive, no xcodegen. Simulator builds use free
# ad-hoc signing ("Sign to Run Locally"), so no certificate or provisioning
# profile is needed. We must NOT pass CODE_SIGNING_ALLOWED=NO: it strips the
# app's signature and with it the keychain-access entitlement, which breaks the
# tests that run against the real simulator keychain (errSecMissingEntitlement).
#
# Notes:
# - The committed Herden.xcodeproj (project + shared Herden scheme)
#   is the source of truth for CI. project.yml/xcodegen is a local convenience
#   only; CI never regenerates the project.
# - The real-SSH suites are mandatory in CI. The test script provisions
#   disposable high-port sshd instances that run unprivileged as the runner
#   account, plus a Unix-socket fake herdr server, and asserts both the executed
#   test count and the named test behind every mandatory behaviour. Only the
#   real-password fixture needs sudo, because macOS cannot verify an account
#   password without root.
# - Linux Host, Node extension/relay and wire-codegen jobs live in ci-linux.yml.
#   The marketing site lives in landing.yml.

name: CI

# Positive paths prevent Host-only, Node-only, documentation and licensing
# changes from consuming macOS runners. plugin/test-vectors stays here because
# the Swift and Node suites consume the same vectors. scripts/** is deliberately
# broad: those files own the simulator gate, fixtures and release helpers.
on:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - Herden.xcodeproj/**
      - Packages/**
      - project.yml
      - Makefile
      - scripts/**
      - plugin/test-vectors/**
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - Sources/**
      - Tests/**
      - Herden.xcodeproj/**
      - Packages/**
      - project.yml
      - Makefile
      - scripts/**
      - plugin/test-vectors/**
      - .github/workflows/ci.yml

# This group is workflow-specific so Linux and iOS checks on the same commit do
# not cancel each other.
concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (iOS Simulator)
    # macos-26 ships Xcode 26.x and the iOS 26 simulator runtimes. Pinned
    # rather than macos-latest for reproducibility.
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # libghostty-spm's prebuilt XCFramework dominates cold build-for-testing
      # wall-clock (~3–4 minutes of "Checking out" on run 33488345559). Cache
      # the cloned SourcePackages tree and the SwiftPM download cache keyed on
      # Package.resolved so a pin change still misses and re-fetches.
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            .ci/source-packages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Herden.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Test VPS SSH access scripts
        run: scripts/test-vps-ssh-access-scripts.sh

      # Binary supply-chain gate: artifact checksums, device and Simulator
      # slices, and the algorithm policy (no OpenSSL legacy provider, no
      # obsolete SSH methods) that ADR 0011 commits to.
      - name: Verify HerdenSSH native artifacts
        run: make verify-ssh-artifacts

      # xcodebuild -version is enough to pin the image. Listing every
      # simulator runtime cold-starts CoreSimulator on the critical path
      # (~12–29s on hosted macOS-26); the gate's own simctl boot overlaps
      # that work with the build instead.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test CI watchdog
        run: scripts/test-run-with-timeout.sh

      # The script selects one available iPhone 17 UDID, boots it, injects the
      # fixture environment there, and targets that same device for every test
      # action. CI uses the iOS 26 runtime; the app deployment target remains
      # iOS 18.
      - name: Build and test
        timeout-minutes: 32
        # The fixture runs unprivileged; HERDEN_CI_MANDATORY makes the one
        # privileged part (the real-password sshd) a hard requirement here
        # rather than something merge CI may quietly run without.
        env:
          HERDEN_CI_LANE: app
          HERDEN_CI_MANDATORY: "1"
        run: scripts/run-ci-ios-tests.sh

      - name: Upload iOS CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/herden-ci-diagnostics-*
          if-no-files-found: ignore
          retention-days: 7

  herdenssh-package-e2e:
    name: HerdenSSH package E2E (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same rationale as the app job: avoid a critical-path CoreSimulator
      # cold-start; package-lane boot overlaps with build-for-testing.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run package E2E
        timeout-minutes: 12
        env:
          HERDEN_CI_LANE: package
          HERDEN_CI_MANDATORY: "1"
        run: scripts/run-ci-ios-tests.sh

      - name: Upload package CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: herdenssh-package-ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/herden-ci-diagnostics-*
          if-no-files-found: ignore
          retention-days: 7
