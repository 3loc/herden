# Verify the landing page. Deployment is owned by the 3loc fleet repository.
#
# This is the only workflow a landing-only change runs: ci.yml ignores
# `landing/**`, and this one only fires when `landing/**` (or this file)
# changes, so marketing-site edits never spend a macOS runner.
#
# Both pull requests and main stop after typechecking and producing the static
# bundle. Application CI has no credentials for the homelab.

name: Landing

on:
  pull_request:
    paths:
      - landing/**
      - .github/workflows/landing.yml
  push:
    branches: [main]
    paths:
      - landing/**
      - .github/workflows/landing.yml

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
