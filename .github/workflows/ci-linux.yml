# Linux checks for the Herden Host, optional notification extension, Push Relay
# and generated wire types. Keeping these separate means changes outside the iOS
# app do not consume a macOS runner.

name: CI (Linux)

on:
  pull_request:
    paths:
      - runtime/**
      - install.sh
      - landing/public/install.sh
      - scripts/install-host-source.sh
      - scripts/test-install.sh
      - plugin/**
      - relay/**
      - scripts/generate-wire-types.py
      - scripts/herdr-schema.json
      - Sources/Herden/Transport/Generated/**
      - .github/workflows/ci-linux.yml
      - .github/workflows/host-release.yml
  push:
    branches: [main]
    paths:
      - runtime/**
      - install.sh
      - landing/public/install.sh
      - scripts/install-host-source.sh
      - scripts/test-install.sh
      - plugin/**
      - relay/**
      - scripts/generate-wire-types.py
      - scripts/herdr-schema.json
      - Sources/Herden/Transport/Generated/**
      - .github/workflows/ci-linux.yml
      - .github/workflows/host-release.yml

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-test:
    name: Notification extension (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run plugin tests
        run: npm test

  host-runtime:
    name: Herden Host runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: host-ci
      - name: Check formatting
        run: |
          cargo fmt --check
          sh -n ../install.sh
          bash ../scripts/test-install.sh
      - name: Test Host runtime
        run: cargo test --locked --quiet -- --test-threads=1

  relay-test:
    name: Push relay (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run relay tests
        run: npm test

  codegen-drift:
    name: Wire-type codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated wire types are up to date
        run: scripts/generate-wire-types.py --check --schema scripts/herdr-schema.json
