name: Herden Host release

on:
  push:
    tags:
      - "host-v*"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: herden-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: herden-linux-aarch64
          # Zig 0.15.2 cannot consume the macOS 26 SDK shipped by macos-latest.
          # Pin the runner until the vendored Ghostty build moves to a newer Zig.
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: herden-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: herden-macos-aarch64

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: runtime
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Verify unified release version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "host-v${version}" = "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu

      - name: Set Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
          key: host-release-${{ matrix.target }}

      - name: Build Host runtime
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package and checksum
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/herden" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            runtime/${{ matrix.asset }}
            runtime/${{ matrix.asset }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: herden-*
          path: artifacts
          merge-multiple: true

      - name: Build update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("host-v")
          protocol_source = pathlib.Path("runtime/src/protocol/wire.rs").read_text()
          endpoint_source = pathlib.Path("runtime/src/protocol/endpoint.rs").read_text()
          protocol = int(re.search(r"PROTOCOL_VERSION: u32 = (\d+)", protocol_source).group(1))
          endpoint = int(re.search(r"ENDPOINT_PROTOCOL_GENERATION: u32 = (\d+)", endpoint_source).group(1))
          assets = {}
          checksums = {}
          for key in ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64"):
              name = f"herden-{key}"
              digest = pathlib.Path(f"artifacts/{name}.sha256").read_text().split()[0]
              assets[key] = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{tag}/{name}"
              checksums[key] = digest
          manifest = {
              "version": version,
              "protocol": protocol,
              "endpoint_generation": endpoint,
              "notes": f"Herden {tag}",
              "assets": assets,
              "sha256": checksums,
              "announcement": None,
              "releases": {},
          }
          pathlib.Path("artifacts/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload Host binaries to the unified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Herden Host ${GITHUB_REF_NAME#host-v}" \
              --notes "Native Herden Host binaries for Linux and macOS."
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
